<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VALUEX | منصة النوادر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--gold2:#f3d775;--bg:#080808;--card:#131313;--border:#222}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:'Tajawal',sans-serif}
a{text-decoration:none}
.top{background:#d4af37;color:#000;text-align:center;padding:8px;font-weight:900;font-size:13px}
.nav{position:sticky;top:0;z-index:50;background:rgba(8,8,8,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:14px 20px}
.logo{font-family:'Cinzel';font-weight:900;letter-spacing:3px;font-size:22px}
.logo span{color:var(--gold)}
.hero{padding:70px 20px 40px;text-align:center;background:radial-gradient(600px 300px at 50% 0%, #d4af3722, transparent)}
.hero h1{font-size:42px;font-weight:900;line-height:1.1}
.hero h1 i{color:var(--gold);font-style:normal}
.hero p{color:#999;margin:15px auto;max-width:500px}
.btns{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.btn{padding:14px 28px;border-radius:50px;font-weight:900}
.btn-gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#000}
.btn-dark{background:#1a1a1a;border:1px solid #333;color:#fff}
.grid{max-width:1200px;margin:0 auto;padding:30px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;transition:.3s}
.card:hover{border-color:var(--gold);transform:translateY(-4px)}
.img{height:200px;background:#0f0f0f;display:flex;align-items:center;justify-content:center;font-size:70px;position:relative}
.img img{width:100%;height:100%;object-fit:cover}
.price{position:absolute;top:12px;left:12px;background:#000000cc;border:1px solid var(--gold);color:var(--gold);padding:6px 12px;border-radius:20px;font-weight:900;font-size:13px}
.info{padding:16px}
.cat{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:700;margin-bottom:6px}
.title{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;margin-top:12px}
.act{flex:1;padding:10px;border-radius:12px;text-align:center;font-weight:700;font-size:14px}
.act-wa{background:var(--gold);color:#000}
.act-view{background:#1e1e1e;color:#fff;border:1px solid #333}
footer{border-top:1px solid var(--border);text-align:center;padding:30px;color:#666;font-size:13px;margin-top:40px}
</style>
</head>
<body>
<div class="top">🚚 شحن مؤمن عالمياً • مصادقة معتمدة • دفع آمن</div>
<div class="nav">
<div class="logo">VALUE<span>X</span></div>
<div style="display:flex;gap:8px"><a href="admin.html" style="background:#1a1a1a;border:1px solid #333;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px">Admin</a><a id="waTop" href="#" style="background:#fff;color:#000;padding:8px 14px;border-radius:20px;font-weight:900;font-size:13px">واتساب</a></div>
</div>
<div class="hero">
<h1>نوادر <i>الذهب</i> و<br>الأحجار الكريمة</h1>
<p>منصة VALUEX لعشاق الاقتناء النادر. كل قطعة موثقة ومصادق عليها عالمياً.</p>
<div class="btns"><a class="btn btn-gold" href="#shop">تصفح النوادر</a><a class="btn btn-dark" href="admin.html">لوحة التحكم</a></div>
</div>
<div id="shop" class="grid"></div>
<footer>© 2026 VALUEX • غزة - فلسطين • صنع بفخر<br><br>لوحة التحكم: valuex.pages.dev/admin.html | الباسورد: valuex2026</footer>
<script>
let defaults=[
{title:'جنيه فلسطيني ذهبي - 1922',price:'2850',emoji:'🪙',cat:'عملات نادرة'},
{title:'ياقوت أحمر ملكي - 5.2 قيراط',price:'4200',emoji:'💎',cat:'أحجار كريمة'},
{title:'دينار أموي ذهبي - 697م',price:'3750',emoji:'🏺',cat:'عملات إسلامية'},
{title:'زمرد كولومبي - 3.8 قيراط',price:'5600',emoji:'💚',cat:'أحجار كريمة'},
{title:'ليرة عثمانية ذهبية',price:'1950',emoji:'👑',cat:'عملات'},
{title:'ألماس أصفر طبيعي',price:'8900',emoji:'🔶',cat:'أحجار نادرة'}
];
let products=JSON.parse(localStorage.getItem('vx_products')||'null')||defaults;
let wa=localStorage.getItem('vx_wa')||'970599000000';
document.getElementById('waTop').href=`https://wa.me/${wa}`;
let grid=document.getElementById('shop');
function render(){
grid.innerHTML=products.map(p=>{
let isImg=p.emoji && p.emoji.startsWith('http');
let media=isImg?`<img src="${p.emoji}" onerror="this.parentElement.innerHTML='🪙'">`:p.emoji;
let waMsg=encodeURIComponent(`مرحبا VALUEX، مهتم في: ${p.title} بسعر $${p.price}`);
return `<div class="card"><div class="img"><div class="price">$${p.price}</div>${isImg?`<img src="${p.emoji}">`:`<span>${media}</span>`}</div><div class="info"><div class="cat">${p.cat}</div><div class="title">${p.title}</div><div class="actions"><a class="act act-wa" href="https://wa.me/${wa}?text=${waMsg}">واتساب</a><a class="act act-view" href="https://wa.me/${wa}?text=${waMsg}">تفاصيل</a></div></div></div>`
}).join('');
}
render();
window.addEventListener('storage',()=>{products=JSON.parse(localStorage.getItem('vx_products'))||'null')||defaults;render()})
setInterval(()=>{let np=localStorage.getItem('vx_products');if(np){let p2=JSON.parse(np);if(JSON.stringify(p2)!==JSON.stringify(products)){products=p2;render()}}},1000);
</script>
</body>
</html>
