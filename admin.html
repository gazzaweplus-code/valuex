<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VALUEX Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh}
.login{max-width:380px;margin:80px auto;padding:30px;background:#151515;border:1px solid #222;border-radius:20px;text-align:center}
input{width:100%;padding:14px;margin:10px 0;background:#0a0a0a;border:1px solid #333;border-radius:12px;color:#fff;font-size:15px}
.btn{background:#d4af37;color:#000;padding:14px;border:none;border-radius:50px;font-weight:900;width:100%;cursor:pointer;margin-top:10px;font-size:15px}
.admin{display:none;max-width:800px;margin:0 auto;padding:20px}
.card{background:#151515;border:1px solid #222;border-radius:16px;padding:20px;margin:15px 0}
.prod{display:flex;justify-content:space-between;align-items:center;background:#0f0f0f;border:1px solid #222;padding:12px;border-radius:10px;margin:8px 0}
</style>
</head>
<body>
<div id="loginBox" class="login">
<h2>VALUEX <span style="color:#d4af37">ADMIN</span></h2>
<p style="color:#888;margin:15px 0">لوحة التحكم - دخول آمن</p>
<input type="password" id="pass" placeholder="••••••••">
<button class="btn" onclick="doLogin()">دخول</button>
</div>

<div id="adminBox" class="admin">
<h2>مرحبا يا بطل! 👋 <span style="color:#d4af37">VALUEX</span></h2>
<p style="color:#888;margin:10px 0">من هون بتضيف منتجات جديدة</p>

<div class="card">
<h3>➕ اضافة منتج</h3>
<input id="title" placeholder="اسم المنتج - مثال: جنيه ذهبي">
<input id="price" placeholder="السعر - مثال: 2850">
<input id="emoji" placeholder="رابط الصورة او ايموجي 🪙">
<input id="cat" placeholder="القسم - مثال: عملات">
<button class="btn" onclick="addProd()">اضافة ✅</button>
</div>

<div class="card">
<h3>📦 المنتجات (<span id="count">0</span>)</h3>
<div id="list"></div>
<button class="btn" style="background:#222;color:#fff;margin-top:15px" onclick="resetAll()">🔄 ارجاع المنتجات الاصلية</button>
<a href="https://valuex.pages.dev" target="_blank" class="btn" style="background:#fff;color:#000;display:block;text-align:center;text-decoration:none;margin-top:10px">👁️ فتح المتجر</a>
</div>

<div class="card">
<h3>⚙️ رقم الواتساب</h3>
<input id="wa" placeholder="970599XXXXXX">
<button class="btn" style="background:#222;color:#d4af37;border:1px solid #d4af37" onclick="saveWa()">حفظ رقم الواتساب</button>
</div>
</div>

<script>
function doLogin(){
 let p=document.getElementById('pass').value;
 if(p==='valuex2026'){
  localStorage.setItem('vx_auth','1');
  show();
 }else{
  alert('الباسورد غلط!');
 }
}
function show(){
 document.getElementById('loginBox').style.display='none';
 document.getElementById('adminBox').style.display='block';
 load();
}
if(localStorage.getItem('vx_auth')==='1'){show();}
let defaults=[
 {title:'جنيه فلسطيني ذهبي 1922',price:'2850',emoji:'🪙',cat:'عملات'},
 {title:'ياقوت احمر ملكي 5.2 قيراط',price:'4200',emoji:'💎',cat:'احجار'},
 {title:'دينار اموي ذهبي 697م',price:'3750',emoji:'🏺',cat:'عملات'},
 {title:'زمرد كولومبي 3.8 قيراط',price:'5600',emoji:'💚',cat:'احجار'},
 {title:'ليرة عثمانية ذهبية',price:'1950',emoji:'👑',cat:'عملات'},
 {title:'الماس اصفر طبيعي',price:'8900',emoji:'🔶',cat:'احجار'}
];
let products=JSON.parse(localStorage.getItem('vx_products')||'null');
if(!products){products=defaults; localStorage.setItem('vx_products',JSON.stringify(products));}
function load(){
 document.getElementById('count').innerText=products.length;
 let h='';
 for(let i=0;i<products.length;i++){
  let p=products[i];
  h+='<div class="prod"><div><b>'+p.title+'</b><br><small style="color:#d4af37">$'+p.price+'</small></div><button onclick="delProd('+i+')" style="background:#3a1010;color:#ff6666;border:none;padding:6px 12px;border-radius:8px">حذف</button></div>';
 }
 document.getElementById('list').innerHTML=h;
 document.getElementById('wa').value=localStorage.getItem('vx_wa')||'';
}
function addProd(){
 let t=document.getElementById('title').value;
 let pr=document.getElementById('price').value;
 let em=document.getElementById('emoji').value||'🪙';
 let c=document.getElementById('cat').value||'عام';
 if(!t||!pr){alert('اكتب الاسم والسعر'); return;}
 products.unshift({title:t,price:pr,emoji:em,cat:c});
 localStorage.setItem('vx_products',JSON.stringify(products));
 document.getElementById('title').value=''; document.getElementById('price').value=''; document.getElementById('emoji').value='';
 load();
}
function delProd(i){products.splice(i,1);localStorage.setItem('vx_products',JSON.stringify(products));load();}
function resetAll(){if(confirm('ترجع الـ 6 منتجات الاصلية؟')){products=defaults;localStorage.setItem('vx_products',JSON.stringify(products));load();}}
function saveWa(){let w=document.getElementById('wa').value;localStorage.setItem('vx_wa',w);alert('تم حفظ الواتساب: '+w);}
</script>
</body>
</html>
